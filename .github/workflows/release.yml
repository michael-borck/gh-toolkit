name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Check whether this version is already on PyPI
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://pypi.org/pypi/gh-toolkit/${version}/json" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.already != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
